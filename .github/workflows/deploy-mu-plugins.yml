name: Deploy mu-plugins to production

on:
  push:
    branches: [master]
    paths:
      - 'wp-content/mu-plugins/**'
      - 'wp-content/plugins/cindemir-lcp-guard/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy mu-plugins via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          protocol: sftp
          local-dir: wp-content/mu-plugins/
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}/wp-content/mu-plugins/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy cindemir-lcp-guard plugin via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          protocol: sftp
          local-dir: wp-content/plugins/cindemir-lcp-guard/
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}/wp-content/plugins/cindemir-lcp-guard/
          dangerous-clean-slate: false

      - name: Purge WP Rocket cache
        env:
          PURGE_URL: ${{ secrets.WP_ROCKET_PURGE_URL }}
        run: |
          if [ -n "$PURGE_URL" ]; then
            curl -fsSL -X POST "$PURGE_URL" -H "User-Agent: cindemirwebsite-deploy" || true
          fi
